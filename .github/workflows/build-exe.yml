name: Portable EXE bauen

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['sim.js', 'AGENTS.md', 'README.md', 'stats/*.md', 'build/**', '.github/workflows/build-exe.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release-Version (z. B. v1.0.0), leer = nur bauen'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build/build-exe.js win
      - run: Compress-Archive -Path dist/TicketSimulator.exe -DestinationPath dist/TicketSimulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TicketSimulator
          path: dist/TicketSimulator.exe

      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: >
          gh release create "$env:VERSION"
          dist/TicketSimulator.exe dist/TicketSimulator.zip
          --target "${{ github.sha }}"
          --title "IT-Ticket-Simulator $env:VERSION"
          --notes-file build/release-notes.md
